name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_ver="${GITHUB_REF_NAME#v}"
          pkg_ver="$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' robodiag_ros2.py | head -1)"
          echo "tag=${tag_ver} package=${pkg_ver}"
          if [ -z "${pkg_ver}" ] || [ "${tag_ver}" != "${pkg_ver}" ]; then
            echo "::error::Tag '${tag_ver}' does not match robodiag_ros2.VERSION '${pkg_ver}'. Bump VERSION in robodiag_ros2.py before tagging."
            exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # API token, not a password. Add it in GitHub → Settings →
          # Secrets and variables → Actions → New repository secret.
          password: ${{ secrets.PYPI_API_TOKEN }}
