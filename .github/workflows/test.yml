name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The tested modules (core, jev, rdcd) are stdlib-only; ROS 2 is not needed.
      - name: Install pytest and pyflakes
        run: python -m pip install --upgrade pip pytest pyflakes

      # robodiag_ros2.py cannot be imported without ROS 2, so tests miss
      # NameErrors there; fail the build on undefined names instead.
      - name: Check for undefined names
        run: |
          python -m pyflakes *.py | tee pyflakes.out
          ! grep -i "undefined name" pyflakes.out

      - name: Run tests
        run: python -m pytest -q
