name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The tested modules (core, jev, rdcd) are stdlib-only; ROS 2 is not needed.

      - name: Install pytest, ruff and coverage
        run: python -m pip install --upgrade pip pytest pytest-cov ruff

      # robodiag_ros2.py cannot be imported without ROS 2, so tests miss
      # NameErrors there; ruff (pyflakes rules) fails the build on those and on unused imports.
      - name: Lint
        run: python -m ruff check .

      - name: Run tests with coverage gate
        run: python -m pytest -q --cov=robodiag_core --cov=robodiag_jev --cov=robodiag_rdcd --cov=robodiag_config --cov=robodiag_report --cov=robodiag_bag --cov-report=term-missing
