[build-system]
# PEP 517 build backend. Kept minimal so the project also builds with the
# older setuptools shipped by ROS 2 Humble images (>=42 works; setup.cfg holds
# the metadata). Requires network only when pip uses build isolation; add
# --no-build-isolation to build fully offline with the system setuptools.
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# Pyflakes (undefined names / unused imports) and import-position errors only.
select = ["F", "E402", "E711", "E712", "E713", "E714", "E721", "E722"]

[tool.coverage.run]
omit = ["test_*.py", "setup.py"]

[tool.coverage.report]
fail_under = 70
