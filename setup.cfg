[metadata]
name = robodiag-harness
# Single-sourced from robodiag_ros2.VERSION (read statically; does not import rclpy).
version = attr: robodiag_ros2.VERSION
description = AI diagnostic agent for ROS 2 robots — evidence-based, tool-calling, safety-gated
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/YueBit/robodiag-harness
author = RoboDiag Contributors
author_email = YueBit@users.noreply.github.com
license = Apache-2.0
license_files = LICENSE
project_urls =
    Source = https://github.com/YueBit/robodiag-harness
    Issues = https://github.com/YueBit/robodiag-harness/issues
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    Intended Audience :: Science/Research
    License :: OSI Approved :: Apache Software License
    Operating System :: POSIX :: Linux
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Topic :: Scientific/Engineering
    Topic :: System :: Monitoring

[options]
# Top-level modules (robodiag_ros2.py + the dependency-free Jev router).
py_modules =
    robodiag_ros2
    robodiag_jev
    robodiag_core
python_requires = >=3.10
install_requires =
    rich>=12
# NOTE: rclpy and the ROS message packages are intentionally NOT listed here —
# they come from the ROS 2 distribution, not from PyPI. Source your ROS
# environment (e.g. /opt/ros/humble/setup.bash) before running the CLI.

[options.extras_require]
completion =
    prompt_toolkit>=3.0
agent =
    openai>=1.0
all =
    prompt_toolkit>=3.0
    openai>=1.0

[options.entry_points]
console_scripts =
    robodiag = robodiag_ros2:main
# Tip: the repo also ships a bash launcher named "robodiag" that auto-sources
# ROS 2. If you would rather install a console entry point under that name too,
# add: robodiag-harness = robodiag_ros2:main
# (be aware it will overwrite any existing ~/.local/bin/robodiag-harness).
